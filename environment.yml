name: crypto_market_state

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pandas=2.3
  - numpy=1.26
  - scipy=1.11
  - pyarrow>=14
  - scikit-learn=1.3
  - xgboost=1.7
  - matplotlib
  - seaborn
  - jupyterlab
  - ipython

  - pip:
      - kedro==1.2.0
      - kedro-datasets==9.1.1
      - kedro-telemetry
      - python-binance
      - yfinance
      - fredapi
      - optuna
      - hyperopt
      - statsmodels
      - hmmlearn

