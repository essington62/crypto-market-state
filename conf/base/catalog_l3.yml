# =====================================================
# ====================== L3 PRIMARY ===================
# =====================================================
# Primary feature layer (Feature Engineering).
# Deterministic statistical feature creation.
# All datasets use .parquet.

# -----------------------------------------------------
# CRYPTO - SPOT - BUSINESS DAY (Features per asset)
# -----------------------------------------------------
spot_business_day_features:
  type: kedro_datasets.partitions.PartitionedDataset
  path: data/03_primary/spot/business_day
  filename_suffix: ".parquet"
  dataset:
    type: kedro_datasets.pandas.ParquetDataset
    save_args:
      compression: snappy


# -----------------------------------------------------
# CRYPTO - SPOT - BUSINESS DAY (Fase 2 intermediates)
# -----------------------------------------------------
btc_bday_features_raw:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/spot/business_day/btc_features_raw.parquet
  save_args:
    compression: snappy

btc_cross_crypto_features_raw:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/spot/business_day/btc_cross_crypto_raw.parquet
  save_args:
    compression: snappy

btc_spot_bday_model_input:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/04_model_input/spot/business_day/BTCUSDT.parquet
  save_args:
    compression: snappy


