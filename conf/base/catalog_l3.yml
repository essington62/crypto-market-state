# =====================================================
# ====================== L3 PRIMARY ===================
# =====================================================
# Primary feature layer (Feature Engineering).
# Deterministic statistical feature creation.
# All datasets use .parquet.

# -----------------------------------------------------
# SPOT — 4H (BTC features)
# -----------------------------------------------------
btc_spot_features_4h:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/spot/4h/BTCUSDT.parquet
  save_args:
    compression: snappy

# -----------------------------------------------------
# DERIVATIVES — COINGLASS 4H (BTC features)
# -----------------------------------------------------
btc_coinglass_features_4h:
  type: kedro_datasets.pandas.ParquetDataset
  filepath: data/03_primary/derivatives/coinglass/BTCUSDT_4h.parquet
  save_args:
    compression: snappy

