# =====================================================
# ===================== GLOBAL ========================
# =====================================================

global:
  start_date: "2023-01-01"
  interval: "1d"
  timezone: "UTC"

calendar:
  business_day_weekmask: "Mon Tue Wed Thu Fri"


# =====================================================
# ====================== BINANCE ======================
# =====================================================

binance:
  source: "binance"
  market: "spot"

  calendar:
    type: "continuous"
    timezone: "UTC"

  interval: "1d"

  # used to bootstrap incremental pipeline when no partitions exist
  dummy: null

  # usado pelo pipeline incremental
  spot_symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT

  # mantido para compatibilidade com ingestão full
  assets:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT


# =====================================================
# ================= NORMALIZATION — SPOT 4H ===========
# =====================================================

normalization.spot_intraday_4h:
  max_candles: 1080   # ≈ 6 months at 4h interval; aligns with Coinglass Hobbyist window

# ================= BINANCE INTRADAY ==================
# =====================================================

binance_intraday:

  source: "binance"
  market: "spot"

  calendar:
    type: "continuous"
    timezone: "UTC"

  interval: "4h"

  # used for incremental pipelines
  dummy: null

  assets:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT

  start_date: "2024-01-01"


# =====================================================
# ======================== FRED =======================
# =====================================================

fred:
  source: "fred"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  series:

    - id: FEDFUNDS
      name: fed_funds_rate
      category: monetary_policy

    - id: DGS2
      name: us_2y_yield
      category: yield_curve

    - id: DGS10
      name: us_10y_yield
      category: yield_curve

    - id: CPIAUCSL
      name: cpi
      category: inflation

    - id: UNRATE
      name: unemployment_rate
      category: labor_market

    - id: WALCL
      name: fed_balance_sheet
      category: liquidity

    - id: INDPRO
      name: industrial_production
      category: growth

    - id: PAYEMS
      name: nonfarm_payrolls
      category: growth

    - id: STLFSI4
      name: macro_financial_stress_index
      category: macro_risk

    - id: RRPONTSYD
      name: macro_reverse_repo_balance
      category: macro_liquidity

    - id: TEDRATE
      name: macro_ted_spread
      category: macro_credit


# =====================================================
# ===================== YFINANCE ======================
# =====================================================

yfinance:
  source: "yfinance"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  indices:

    - ticker: "^VIX"
      name: vix
      category: volatility

    - ticker: "DX-Y.NYB"
      name: dxy
      category: fx

  assets:

    - ticker: "^GSPC"
      name: sp500
      category: equity_index

    - ticker: "^IXIC"
      name: nasdaq
      category: equity_index

    - ticker: "GC=F"
      name: gold
      category: commodity


# =====================================================
# ====================== L3 CRYPTO ====================
# =====================================================

l3:

  crypto:

    spot_business_day:

      vol_short_window: 7
      vol_long_window: 30

      drawdown_window: 90

      volume_window: 30

      slope_window: 21
      bb_window: 20
      ma_50_window: 50
      ma_200_window: 200
      ma_52w_window: 252

      rs_window: 5
      beta_window: 30
      dd_rel_window: 90

    spot_daily:

      ret_short_window: 7
      ret_long_window: 30

      vol_short_window: 7
      vol_long_window: 30

      drawdown_window: 90

      ma_window: 30

      volume_window: 30

      use_log_returns: true
      use_vol_ratio: true
      use_drawdown: true
      use_volume_zscore: true
      use_range_relative: true

      skew_window: 30
      kurt_window: 30
      hurst_window: 30
      er_window: 10

      ma_200_window: 200
      ma_50_window: 50
      ma_52w_window: 252
      slope_window: 21
      bb_window: 20

      rsi_short_window: 14
      rsi_long_window: 30
      macd_fast: 12
      macd_slow: 26
      macd_signal_period: 9
      atr_window: 14
      range_window: 30


# =====================================================
# ==================== MODELING =======================
# =====================================================

modeling:

  regime_hmm:

    n_states: 2
    covariance_type: "diag"
    n_iter: 1000
    random_state: 42

    standardize: true

    features:
      - log_return
      - vol_short
      - vol_ratio
      - drawdown
      - volume_z
      - slope_21d
      - top_position_ratio


# =====================================================
# ==================== WALKFORWARD ====================
# =====================================================

walkforward:

  horizon_days: 5
  embargo_days: 2

  splits:

    - name: split_1
      train_start: 2023-01-01
      train_end:   2023-12-31
      test_start:  2024-01-01
      test_end:    2024-06-30

    - name: split_2
      train_start: 2023-01-01
      train_end:   2024-06-30
      test_start:  2024-07-01
      test_end:    2024-12-31

    - name: split_3
      train_start: 2023-01-01
      train_end:   2024-12-31
      test_start:  2025-01-01
      test_end:    null


# =====================================================
# ==================== COINGLASS ======================
# =====================================================

coinglass:

  api:
    base_url: "https://open-api-v4.coinglass.com"

  assets:
    - symbol: "BTC"
      pair: "BTCUSDT"

    - symbol: "ETH"
      pair: "ETHUSDT"

  interval: "1d"
  start_date: "2020-10-01"

  liquidation_exchange_list: "ALL"

  retry_attempts: 3
  retry_backoff: 5
  request_sleep: 3.0


# =====================================================
# ============= COINGLASS INTRADAY 4H =================
# =====================================================

coinglass_intraday:

  interval: "4h"

  start_date: "2024-01-01"

  # Pair-level symbols (used for endpoints that require exchange + BTCUSDT format)
  assets:
    - BTCUSDT
    - ETHUSDT

  # Coin-level symbols (used for endpoints that require BTC / ETH format)
  coins:
    - BTC
    - ETH

  exchange: "Binance"

  # Bootstrap value when no existing partition is present
  dummy: null
