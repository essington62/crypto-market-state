# =====================================================
# ===================== GLOBAL ========================
# =====================================================

global:
  start_date: "2020-10-01"   # default para daily/weekly/monthly (yfinance + FRED)
  interval: "1d"
  timezone: "UTC"

calendar:
  business_day_weekmask: "Mon Tue Wed Thu Fri"


# =====================================================
# ====================== BINANCE ======================
# =====================================================

binance:
  source: "binance"
  market: "spot"

  calendar:
    type: "continuous"
    timezone: "UTC"

  interval: "1d"

  # used to bootstrap incremental pipeline when no partitions exist
  dummy: null

  # usado pelo pipeline incremental
  spot_symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT

  # mantido para compatibilidade com ingestão full
  assets:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT


# =====================================================
# ================= NORMALIZATION — SPOT 4H ===========
# =====================================================

normalization.spot_intraday_4h:
  max_candles: 1080   # ≈ 6 months at 4h interval; aligns with Coinglass Hobbyist window

# ================= BINANCE INTRADAY ==================
# =====================================================

binance_intraday:

  source: "binance"
  market: "spot"

  calendar:
    type: "continuous"
    timezone: "UTC"

  interval: "4h"

  # used for incremental pipelines
  dummy: null

  assets:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT

  # 4h data: mantém janela móvel ≈ 6 meses (alinhado com CoinGlass Hobbyist).
  # Início real do acúmulo via cron. NÃO reprocessar sem backup.
  start_date: "2025-09-22"


# =====================================================
# ======================== FRED =======================
# =====================================================

fred:
  source: "fred"

  # start_date explícito — independente do global.
  # Séries FRED diárias/semanais/mensais desde 2020-10-01.
  # Obs: WALCL começa 2020-10-07 (dado genuinamente ausente antes disso).
  start_date: "2020-10-01"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  series:

    - id: FEDFUNDS
      name: fed_funds_rate
      category: monetary_policy

    - id: DGS2
      name: us_2y_yield
      category: yield_curve

    - id: DGS10
      name: us_10y_yield
      category: yield_curve

    - id: CPIAUCSL
      name: cpi
      category: inflation

    - id: UNRATE
      name: unemployment_rate
      category: labor_market

    - id: WALCL
      name: fed_balance_sheet
      category: liquidity

    - id: INDPRO
      name: industrial_production
      category: growth

    - id: PAYEMS
      name: nonfarm_payrolls
      category: growth

    - id: STLFSI4
      name: macro_financial_stress_index
      category: macro_risk

    - id: RRPONTSYD
      name: macro_reverse_repo_balance
      category: macro_liquidity

    - id: TEDRATE
      name: macro_ted_spread
      category: macro_credit


# =====================================================
# ===================== YFINANCE ======================
# =====================================================

yfinance:
  source: "yfinance"

  # start_date explícito — independente do global.
  # Todos os tickers diários (business_day) devem ter histórico desde 2020-10-01.
  start_date: "2020-10-01"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  indices:

    - ticker: "^VIX"
      name: vix
      category: volatility

    - ticker: "DX-Y.NYB"
      name: dxy
      category: fx

  assets:

    - ticker: "^GSPC"
      name: sp500
      category: equity_index

    - ticker: "^IXIC"
      name: nasdaq
      category: equity_index

    - ticker: "GC=F"
      name: gold
      category: commodity

    # Commodities / Geopolitical
    - ticker: "CL=F"
      name: oil_wti
      category: commodity

    - ticker: "BZ=F"
      name: oil_brent
      category: commodity

    - ticker: "NG=F"
      name: natural_gas
      category: commodity

    # Fear indicators
    - ticker: "^MOVE"
      name: move_index
      category: volatility

    - ticker: "^OVX"  # CORRIGIDO: ^OVX em vez de OVX
      name: oil_volatility
      category: volatility

    # Defense / Geopolitical proxy
    - ticker: "ITA"
      name: defense_etf
      category: geopolitical

    # Credit stress
    - ticker: "HYG"
      name: high_yield_bonds
      category: credit

    - ticker: "LQD"
      name: investment_grade_bonds
      category: credit

    # Inflation / Breakeven
    - ticker: "TIP"
      name: tips_etf
      category: inflation


# =====================================================
# ====================== L3 CRYPTO ====================
# =====================================================

l3:

  crypto:

    spot_business_day:

      vol_short_window: 7
      vol_long_window: 30

      drawdown_window: 90

      volume_window: 30

      slope_window: 21
      bb_window: 20
      ma_50_window: 50
      ma_200_window: 200
      ma_52w_window: 252

      rs_window: 5
      beta_window: 30
      dd_rel_window: 90

    spot_daily:

      ret_short_window: 7
      ret_long_window: 30

      vol_short_window: 7
      vol_long_window: 30

      drawdown_window: 90

      ma_window: 30

      volume_window: 30

      use_log_returns: true
      use_vol_ratio: true
      use_drawdown: true
      use_volume_zscore: true
      use_range_relative: true

      skew_window: 30
      kurt_window: 30
      hurst_window: 30
      er_window: 10

      ma_200_window: 200
      ma_50_window: 50
      ma_52w_window: 252
      slope_window: 21
      bb_window: 20

      rsi_short_window: 14
      rsi_long_window: 30
      macd_fast: 12
      macd_slow: 26
      macd_signal_period: 9
      atr_window: 14
      range_window: 30


# =====================================================
# =========== PRIMARY — DERIVATIVES 4H ================
# =====================================================

primary.derivatives_4h:
  oi_momentum_window: 3         # candles (3 × 4h = 12h)
  oi_volatility_window: 6       # candles (6 × 4h = 24h)
  funding_pressure_window: 180  # candles for z-score (≈ 30 days at 4h)


# =====================================================
# =========== PRIMARY — ORDER BOOK 4H =================
# =====================================================

primary.orderbook_4h:
  rolling_window: 6   # candles (6 × 4h = 24h) — used for imbalance_ma, imbalance_std, depth_zscore


# =====================================================
# =========== PRIMARY — REGIME CONTEXT ================
# =====================================================

primary.regime_context:
  r11_model_path: "scripts/paper_trading/state/r11_hmm_model.pkl"


# =====================================================
# ==================== MODELING =======================
# =====================================================

modeling:

  regime_hmm:

    n_states: 2
    covariance_type: "diag"
    n_iter: 1000
    random_state: 42

    standardize: true

    features:
      - log_return
      - vol_short
      - vol_ratio
      - drawdown
      - volume_z
      - slope_21d
      - top_position_ratio


# =====================================================
# ==================== WALKFORWARD ====================
# =====================================================

walkforward:

  horizon_days: 5
  embargo_days: 2

  splits:

    - name: split_1
      train_start: 2023-01-01
      train_end:   2023-12-31
      test_start:  2024-01-01
      test_end:    2024-06-30

    - name: split_2
      train_start: 2023-01-01
      train_end:   2024-06-30
      test_start:  2024-07-01
      test_end:    2024-12-31

    - name: split_3
      train_start: 2023-01-01
      train_end:   2024-12-31
      test_start:  2025-01-01
      test_end:    null


# =====================================================
# ==================== COINGLASS ======================
# =====================================================

coinglass:

  api:
    base_url: "https://open-api-v4.coinglass.com"

  assets:
    - symbol: "BTC"
      pair: "BTCUSDT"

    - symbol: "ETH"
      pair: "ETHUSDT"

  interval: "1d"
  start_date: "2020-10-01"

  liquidation_exchange_list: "ALL"

  retry_attempts: 3
  retry_backoff: 5
  request_sleep: 3.0


# =====================================================
# ============= COINGLASS INTRADAY 4H =================
# =====================================================

coinglass_intraday:

  interval: "4h"

  # Início real do acúmulo via cron diário (2025-09-24).
  # CoinGlass Hobbyist retorna apenas os últimos 6 meses.
  # NUNCA reprocessar full sem backup — o histórico acumulado seria perdido.
  start_date: "2025-09-24"

  # Pair-level symbols (used for endpoints that require exchange + BTCUSDT format)
  assets:
    - BTCUSDT
    - ETHUSDT

  # Coin-level symbols (used for endpoints that require BTC / ETH format)
  coins:
    - BTC
    - ETH

  exchange: "Binance"

  # Bootstrap value when no existing partition is present
  dummy: null


# =====================================================
# ========= COINGLASS — ORDER BOOK DEPTH (4H) =========
# =====================================================

ingestion.coinglass.orderbook_4h:
  # Início real do acúmulo via cron: 2025-10-05.
  # Pipeline é sempre incremental — sem start_date fixo.
  # NUNCA reprocessar full sem backup.
  exchange: "Binance"
  interval: "4h"
  limit: 1000
  ranges:
    - "0.5"
    - "1"
    - "2"
  assets:
    - "BTCUSDT"
  sleep_between_ranges: 0.3
  sleep_between_assets: 0.5
  # Bootstrap value — allows the pipeline to start without existing partitions.
  # PartitionedDataset raises "No partitions found" on an empty/missing path,
  # so existing_data is wired to this null param (same pattern as
  # coinglass_intraday). The node handles None → {}.
  dummy: null


# =====================================================
# ============== MODELING — ENTRY 4H ==================
# =====================================================

modeling.entry_4h:

  # Target configuration
  target_col: "close"
  target_horizon: 6          # shift(-6) → 24h direction at 4h cadence
  # regime_filter removed — regime is a feature in SET_B/C/D, not a row filter.
  # r11_regime and r11_prob_bull teach the model to avoid Bear entries naturally.

  # Feature sets — evaluated incrementally (A ⊂ B ⊂ C ⊂ D)
  feature_sets:

    SET_A:
      - returns_4h
      - volatility_24h
      - volume_zscore
      - buy_pressure
      - price_range_4h

    SET_B:
      - returns_4h
      - volatility_24h
      - volume_zscore
      - buy_pressure
      - price_range_4h
      - r11_prob_bull
      - r11_entropy
      - regime_age_log
      - stress_score

    SET_C:
      - returns_4h
      - volatility_24h
      - volume_zscore
      - buy_pressure
      - price_range_4h
      - r11_prob_bull
      - r11_entropy
      - regime_age_log
      - stress_score
      - oi_momentum_12h
      - oi_volatility_24h
      - funding_pressure
      - funding_divergence
      - leverage_expansion

    SET_D:
      - returns_4h
      - volatility_24h
      - volume_zscore
      - buy_pressure
      - price_range_4h
      - r11_prob_bull
      - r11_entropy
      - regime_age_log
      - stress_score
      - oi_momentum_12h
      - oi_volatility_24h
      - funding_pressure
      - funding_divergence
      - leverage_expansion
      - book_imbalance_r05
      - book_imbalance_r1
      - book_imbalance_r2
      - bid_ask_ratio_r1
      - book_depth_r1
      - depth_gradient_near
      - depth_gradient_far
      - total_depth
      - imbalance_ma_6
      - imbalance_std_6
      - depth_zscore_24h
      - oi_momentum_mean_24h
      - funding_divergence_mean_24h
      - leverage_expansion_mean_24h
      - vol_percentile_30d

  # Walk-forward splits — positional indices on the prepared dataset
  # Gap of target_horizon rows prevents target_direction_24h lookahead
  # Splits designed around regime distribution:
  #   [0:100]   Bull=33  Bear=67  | [100:200] Bull=70  Bear=30
  #   [200:300] Bull=11  Bear=89  | [300:400] Bull=93  Bear=7
  #   [400:500] Bull=76  Bear=24  | [500:600] Bull=17  Bear=83
  #   [600:700] Bull=0   Bear=100 | [700:800] Bull=73  Bear=27
  #   [800:900] Bull=88  Bear=12  | [900:1000] Bull=34 Bear=66
  splits:
    - name: "split_1_mixed"
      train_end: 400
      gap_end:   406
      test_end:  600
      note: "train=sep→nov | test=nov/dec mixed Bull/Bear"

    - name: "split_2_bear_heavy"
      train_end: 500
      gap_end:   506
      test_end:  750
      note: "train=sep→dec | test=dec/jan Bear dominant"

    - name: "split_3_bull_heavy"
      train_end: 650
      gap_end:   656
      test_end:  850
      note: "train=sep→jan | test=jan/feb Bull dominant"

    - name: "split_4_recent"
      train_end: 800
      gap_end:   806
      test_end:  1000
      note: "train=sep→feb | test=feb/mar mixed"

  # Entry signal thresholds
  signal:
    entry_prob_threshold: 0.60   # model must predict prob > 0.60 to signal entry
    confidence_threshold: 0.10   # abs(p - 0.5) > 0.10 → candle is "confident"

  # LightGBM hyperparameters
  lgbm:
    objective: binary
    metric: auc
    n_estimators: 300
    learning_rate: 0.02
    num_leaves: 15
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8
    class_weight: balanced
    random_state: 42
    n_jobs: -1
    early_stopping_rounds: 100
    verbose: -1


# =====================================================
# ============= COINGLASS DAILY INDICES ===============
# =====================================================
# L2: normalization.coinglass_indices
# L3: primary.coinglass_indices
# L5: join_coinglass_indices (forward-fill D+1 onto 4h grid)

coinglass_indices:
  zscore_window: 30
  change_window: 7
  ma_window: 30

  indices:
    - name: fear_greed
      value_col: fear_greed

    - name: ahr999
      value_col: ahr999

    - name: puell_multiple
      value_col: puell_multiple

    - name: bubble_index
      value_col: bubble_index

    - name: stablecoin_mcap
      value_col: stablecoin_mcap_usd

    - name: cdri_index
      value_col: cdri_index

    - name: cgdi_index
      value_col: cgdi_index
