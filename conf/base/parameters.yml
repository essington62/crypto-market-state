# =====================================================
# ===================== GLOBAL ========================
# =====================================================

global:
  start_date: "2020-10-01"
  interval: "1d"
  timezone: "UTC"

calendar:
  business_day_weekmask: "Mon Tue Wed Thu Fri"


# =====================================================
# ====================== BINANCE ======================
# =====================================================

# 🔹 Mantido no formato original (compatível com Git)
binance:
  source: "binance"
  market: "spot"

  calendar:
    type: "continuous"
    timezone: "UTC"

  interval: "1d"

  assets:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT


# 🔹 Futures separado (não conflita com spot)
binance_futures:
  source: "binance"
  market: "usdt_perpetual"

  calendar:
    type: "continuous"
    timezone: "UTC"

  base_url: "https://fapi.binance.com"

  symbols:
    - BTCUSDT

  modules:
    klines:
      interval: "1h"
      limit: 1500

    funding:
      limit: 1000


# =====================================================
# ======================== FRED =======================
# =====================================================

fred:
  source: "fred"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  series:
    - id: FEDFUNDS
      name: fed_funds_rate
      category: monetary_policy

    - id: DGS2
      name: us_2y_yield
      category: yield_curve

    - id: DGS10
      name: us_10y_yield
      category: yield_curve

    - id: CPIAUCSL
      name: cpi
      category: inflation

    - id: UNRATE
      name: unemployment_rate
      category: labor_market

    - id: WALCL
      name: fed_balance_sheet
      category: liquidity

    - id: INDPRO
      name: industrial_production
      category: growth

    - id: PAYEMS
      name: nonfarm_payrolls
      category: growth

    - id: STLFSI4
      name: macro_financial_stress_index
      category: macro_risk

    - id: RRPONTSYD
      name: macro_reverse_repo_balance
      category: macro_liquidity

    - id: TEDRATE
      name: macro_ted_spread
      category: macro_credit


# =====================================================
# ===================== YFINANCE ======================
# =====================================================

yfinance:
  source: "yfinance"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  # 🔹 Macro context (vai para macro_daily_raw)
  indices:
    - ticker: "^VIX"
      name: vix
      category: volatility

    - ticker: "DX-Y.NYB"
      name: dxy
      category: fx

  # 🔹 Tradable assets (vai para spot_business_day_raw)
  assets:
    - ticker: "^GSPC"
      name: sp500
      category: equity_index

    - ticker: "^IXIC"
      name: nasdaq
      category: equity_index

    - ticker: "GC=F"
      name: gold
      category: commodity