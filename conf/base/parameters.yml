# =====================================================
# ===================== GLOBAL ========================
# =====================================================

global:
  start_date: "2020-10-01"
  interval: "1d"
  timezone: "UTC"

calendar:
  business_day_weekmask: "Mon Tue Wed Thu Fri"


# =====================================================
# ====================== BINANCE ======================
# =====================================================

# 🔹 Mantido no formato original (compatível com Git)
binance:
  source: "binance"
  market: "spot"

  calendar:
    type: "continuous"
    timezone: "UTC"

  interval: "1d"

  assets:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - ADAUSDT
    - AVAXUSDT
    - LINKUSDT
    - XRPUSDT


# 🔹 Futures separado (não conflita com spot)
binance_futures:
  source: "binance"
  market: "usdt_perpetual"

  calendar:
    type: "continuous"
    timezone: "UTC"

  base_url: "https://fapi.binance.com"

  symbols:
    - BTCUSDT

  modules:
    klines:
      interval: "1h"
      limit: 1500

    funding:
      limit: 1000


# =====================================================
# ======================== FRED =======================
# =====================================================

fred:
  source: "fred"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  series:
    - id: FEDFUNDS
      name: fed_funds_rate
      category: monetary_policy

    - id: DGS2
      name: us_2y_yield
      category: yield_curve

    - id: DGS10
      name: us_10y_yield
      category: yield_curve

    - id: CPIAUCSL
      name: cpi
      category: inflation

    - id: UNRATE
      name: unemployment_rate
      category: labor_market

    - id: WALCL
      name: fed_balance_sheet
      category: liquidity

    - id: INDPRO
      name: industrial_production
      category: growth

    - id: PAYEMS
      name: nonfarm_payrolls
      category: growth

    - id: STLFSI4
      name: macro_financial_stress_index
      category: macro_risk

    - id: RRPONTSYD
      name: macro_reverse_repo_balance
      category: macro_liquidity

    - id: TEDRATE
      name: macro_ted_spread
      category: macro_credit


# =====================================================
# ===================== YFINANCE ======================
# =====================================================

yfinance:
  source: "yfinance"

  calendar:
    type: "business_days"
    timezone: "UTC"
    ffill_allowed: true

  indices:
    - ticker: "^VIX"
      name: vix
      category: volatility

    - ticker: "DX-Y.NYB"
      name: dxy
      category: fx

  assets:
    - ticker: "^GSPC"
      name: sp500
      category: equity_index

    - ticker: "^IXIC"
      name: nasdaq
      category: equity_index

    - ticker: "GC=F"
      name: gold
      category: commodity


# =====================================================
# ====================== L3 CRYPTO ====================
# =====================================================

l3:
  crypto:

    spot_business_day:
      # --- Volatility windows ---
      vol_short_window: 7
      vol_long_window: 30

      # --- Drawdown window ---
      drawdown_window: 90

      # --- Volume normalization ---
      volume_window: 30

      # --- Chartist / structural features ---
      slope_window: 21
      bb_window: 20
      ma_50_window: 50
      ma_200_window: 200
      ma_52w_window: 252

      # --- Cross-crypto features ---
      rs_window: 5
      beta_window: 30
      dd_rel_window: 90

    spot_daily:

      # --- Return windows ---
      ret_short_window: 7
      ret_long_window: 30

      # --- Volatility windows ---
      vol_short_window: 7
      vol_long_window: 30

      # --- Drawdown window ---
      drawdown_window: 90

      # --- Moving average window ---
      ma_window: 30

      # --- Volume normalization ---
      volume_window: 30

      # --- Feature toggles (baseline v0) ---
      use_log_returns: true
      use_vol_ratio: true
      use_drawdown: true
      use_volume_zscore: true
      use_range_relative: true

      # --- Higher-order moment / predictability features ---
      skew_window: 30
      kurt_window: 30
      hurst_window: 30
      er_window: 10

      # --- Chartist / structural features ---
      ma_200_window: 200
      ma_50_window: 50
      ma_52w_window: 252
      slope_window: 21
      bb_window: 20

      # --- Technical features (R5 approved) ---
      rsi_short_window: 14
      rsi_long_window: 30
      macd_fast: 12
      macd_slow: 26
      macd_signal_period: 9
      atr_window: 14
      range_window: 30

# =====================================================
# ==================== MODELING =======================
# =====================================================

modeling:
  regime_hmm:

    # --- Core HMM ---
    n_states: 2
    covariance_type: "diag"      # full | diag — Config E aprovado Rodada 4
    n_iter: 1000
    random_state: 42

    # --- Preprocessing ---
    standardize: true

    # --- Features to use (BASE + slope_21d + top_position_ratio, n_states=2) ---
    features:
      - log_return
      - vol_short
      - vol_ratio
      - drawdown
      - volume_z
      - slope_21d
      - top_position_ratio

# ------------------------------------------------------------
# WALK-FORWARD CONFIGURATION — HMM BASELINE (Fase 1A)
#
# Objetivo:
# Validar robustez temporal do HMM via 3 splits progressivos
# com purging para evitar vazamento de informação.
#
# horizon_days:
# Horizonte prospectivo usado na métrica principal (Δ 5d).
#
# embargo_days:
# Dias adicionais removidos do final do treino para garantir
# zero sobreposição entre janela de treino e retorno futuro do teste.
#
# purge_total = horizon_days + embargo_days
#
# Estrutura dos splits:
# Expansive window (treino cumulativo) + teste anual.
# Isso mede consistência estrutural do regime ao longo de
# diferentes ciclos de mercado (recovery, bull, regime recente).
#
# Este bloco define o BASELINE OFICIAL do modelo.
# Nenhuma feature nova deve ser adicionada antes da
# validação completa destes 3 splits.
# ------------------------------------------------------------
walkforward:
  horizon_days: 5
  embargo_days: 2

  splits:
    - name: split_1
      train_start: 2023-01-01
      train_end:   2023-12-31
      test_start:  2024-01-01
      test_end:    2024-06-30

    - name: split_2
      train_start: 2023-01-01
      train_end:   2024-06-30
      test_start:  2024-07-01
      test_end:    2024-12-31

    - name: split_3
      train_start: 2023-01-01
      train_end:   2024-12-31
      test_start:  2025-01-01
      test_end:    null

# ------------------------------------------------------------
# HMM BASELINE FEATURES (Minimalista)
#
# Conjunto inicial propositalmente enxuto para:
# - Estabelecer baseline econômico
# - Medir Δ prospectivo real
# - Evitar multicolinearidade excessiva
#
# Expansões futuras devem ser testadas isoladamente
# e comparadas contra este baseline.
# ------------------------------------------------------------
# =====================================================
# =================== COINGLASS ======================
# =====================================================
#
# Confirmed available endpoints (validated 2026-03-05):
#   liquidation/aggregated-history  (exchange_list required)
#   fear-greed-history
#   bitcoin/bubble-index
#   puell-multiple
#   ahr999
#
# NOT available on current plan (404):
#   fundingRate, openInterest, globalLongShortAccountRatio,
#   nupl, altcoin_season, stablecoin_mcap, etf_flows, etf_netassets
# =====================================================

coinglass:
  api:
    base_url: "https://open-api-v4.coinglass.com"

  assets:
    - symbol: "BTC"
      pair: "BTCUSDT"
    - symbol: "ETH"
      pair: "ETHUSDT"

  interval: "1d"
  start_date: "2020-10-01"

  # exchange_list for liquidation/aggregated-history (required by API)
  liquidation_exchange_list: "ALL"

  retry_attempts: 3
  retry_backoff: 5
  request_sleep: 3.0


# ------------------------------------------------------------
# XGB REGIME (Fase 2A Baseline)
#
# 12 features: 6 BTC core + 4 cross-crypto + 2 HMM context
# Labels: 3-class ternary per horizon (Bear=0, Neutral=1, Bull=2)
# Walk-forward: same 3 splits as HMM baseline
# ------------------------------------------------------------
xgb_regime:
  features:
    - log_return
    - vol_short
    - vol_ratio
    - drawdown
    - volume_z
    - slope_21d
    - eth_btc_rs_5d
    - alt_dispersion_5d
    - mean_alt_beta_30d
    - mean_alt_dd_rel
    - hmm_state
    - hmm_bull_prob

  n_estimators: 200
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

  horizons:
    - name: horizon_2d
      horizon_days: 2
      bull_threshold: 0.010
      bear_threshold: 0.007

    - name: horizon_5d
      horizon_days: 5
      bull_threshold: 0.015
      bear_threshold: 0.010


# ------------------------------------------------------------
# XGB R5 — Modelo de produção (Fase 1B)
#
# Aprovado após 6 rodadas de ablação.
# Config final: BASE + STRUCTURE + MOMENTUM (21 features)
# Resultados walk-forward: delta médio +0.0139 (2/3 splits)
#
# Treino: 2023-01-01 em diante (pós-FTX, era ETF)
# Label: return_5d = sum(log_return.shift(-k), k=1..5)
# ------------------------------------------------------------
xgb_r5:
  train_start: "2023-01-01"

  # Features ordenadas: BASE → STRUCTURE → MOMENTUM
  features:
    # BASE (8)
    - log_return
    - vol_short
    - vol_ratio
    - drawdown
    - volume_z
    - slope_21d
    - hmm_state
    - bull_prob
    - regime_strength
    # STRUCTURE (6 — bb_width_20d equivalente ao bb_width dos scripts)
    - price_vs_high_30d
    - price_vs_low_30d
    - range_position_30d
    - bb_position
    - bb_width_20d
    - atr_14_norm
    # MOMENTUM (6)
    - rsi_14_z
    - rsi_30
    - macd_hist_norm
    - roc_5
    - roc_10
    - roc_21

  model:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.7
    min_child_weight: 3
    gamma: 0.5
    random_state: 42

  signal:
    threshold_long: 0.60
    threshold_short: 0.40
    strong_bull_prob: 0.65
    strong_bear_prob: 0.35
    strong_prob_threshold: 0.65