# =====================================================
# ======================= L1 RAW ======================
# =====================================================

# -----------------------------------------------------
# MACRO (não-negociável)
# -----------------------------------------------------
macro_daily_raw:
  type: kedro_datasets.partitions.PartitionedDataset
  path: data/01_raw/macro/daily
  dataset:
    type: kedro_datasets.pandas.ParquetDataset
    save_args:
      compression: snappy


# -----------------------------------------------------
# SPOT ASSETS (negociáveis)
# Inclui:
# - Crypto (Binance)
# - Equity indices (S&P, Nasdaq)
# - Commodities (Gold)
# - FX spot (se aplicável)
# -----------------------------------------------------
spot_daily_raw:
  type: kedro_datasets.partitions.PartitionedDataset
  path: data/01_raw/spot/daily
  dataset:
    type: kedro_datasets.pandas.ParquetDataset
    save_args:
      compression: snappy


